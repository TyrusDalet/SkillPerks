name: "SkillPerks"
settings: "Settings"
disableName: "Disable Mod"
disableDescription: "Disable all SkillPerks perks."
perkVisibilityModeName: "Perk Visibility"
perkVisibilityModeDescription: "Controls which SkillPerks appear in the perk menu.\n1) Show every perk\n2) Show perks once that skill reaches 25\n3) Show perks up to your current skill tier\n4) Show perks whose chain path is reachable\n5) Show only perks whose requirements are fully met"
enableLoggingName: "Verbose Logging"
enableLoggingDescription: "Print detailed debug information to the console. Intended for testing, not normal play."
debugVerbosityName: "Debug Verbosity"
debugVerbosityDescription: "Controls SkillPerks debug logging.\n0) Off\n1) Important state changes and failures\n2) Detailed perk decisions\n3) Full step-by-step traces for skills enabled with their debug trace command"
longBladeHudSettings: "Long Blade HUD"
longBladeHudEnableName: "Show Long Blade HUD"
longBladeHudEnableDescription: "Show a small Morrowind-style Momentum widget when Long Blade Momentum perks are available."
longBladeHudPositionName: "Long Blade HUD Position"
longBladeHudPositionDescription: "Choose which screen edge or corner the Long Blade Momentum widget anchors to."
longBladeHudUpdateEveryName: "Long Blade HUD Update Interval"
longBladeHudUpdateEveryDescription: "Increasing this number can improve performance, at the cost of delayed HUD updates."
wardHudSettings: "Ward of Delay HUD"
wardHudEnableName: "Show Ward of Delay HUD"
wardHudEnableDescription: "Show a compact Morrowind-style display for available and dissipating Health and Fatigue reserves while Ward of Delay is owned."
wardHudPositionName: "Ward HUD Position"
wardHudPositionDescription: "Choose which screen edge or corner the Ward of Delay widget anchors to."
wardHudUpdateEveryName: "Ward HUD Update Interval"
wardHudUpdateEveryDescription: "Increasing this number can improve performance, at the cost of less frequent reserve updates."
